<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD View</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">



  <!-- For Mermaid Diagrams only (seem doesn't work) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.min.js"></script>



  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      min-height: 100vh;
      background: #fff;
      color: #1f2328;
    }
    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #f6f8fa;
      border-right: 1px solid #d0d7de;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 20px 0;
    }
    .sidebar h1 {
      font-size: 18px;
      margin: 0 20px 16px;
    }
    .sidebar ul { list-style: none; margin: 0; padding: 0; }
    .sidebar a {
      display: block;
      padding: 9px 20px;
      color: #1f2328;
      text-decoration: none;
      border-left: 3px solid transparent;
    }
    .sidebar a:hover { background: #eaeef2; }
    .sidebar a.active {
      background: #ddf4ff;
      border-left-color: #0969da;
      color: #0969da;
      font-weight: 600;
    }
    /* ---------- Content ---------- */
    main {
      flex: 1;
      min-width: 0;
      padding: 32px 48px;
    }
    .markdown-body { max-width: 860px; margin: 0 auto; }
    .error { color: #cf222e; }
    /* ---------- Mobile ---------- */
    .menu-toggle { display: none; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; padding: 12px 0; }
      .sidebar ul { display: none; }
      .sidebar.open ul { display: block; }
      .sidebar h1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0; }
      .menu-toggle {
        display: inline-block; background: none; border: 1px solid #d0d7de;
        border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 16px;
      }
      .sidebar.open h1 { margin-bottom: 12px; }
      main { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <nav class="sidebar" id="sidebar">
    <h1>MD View <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button></h1>
    <ul id="menu"></ul>
  </nav>

  <main>
    <article class="markdown-body" id="content">Loading…</article>
  </main>





  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    // ===== Menu configuration: add your markdown files here =====
    const PAGES = [
      { title: "Example 1", file: "pages/example-1.md" },
      { title: "Example 2",     file: "pages/example-2.md" },
      { title: "Example 3",  file: "pages/no-file.md" },
      { title: "Testing",      file: "pages/testing.md" },
      { title: "Deployment",   file: "pages/deployment.md" },
    ];

    const menu = document.getElementById("menu");
    const content = document.getElementById("content");
    const sidebar = document.getElementById("sidebar");

    document.getElementById("menuToggle").addEventListener("click", () =>
      sidebar.classList.toggle("open"));

    // Build sidebar menu
    PAGES.forEach(p => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + p.file;
      a.textContent = p.title;
      li.appendChild(a);
      menu.appendChild(li);
    });

    const dirOf = path => path.includes("/") ? path.slice(0, path.lastIndexOf("/") + 1) : "";

    // Resolve a relative path against the current markdown file's folder
    function resolvePath(base, rel) {
      const url = new URL(rel, "http://x/" + base);
      return url.pathname.slice(1) + url.hash;
    }

    async function loadPage(file) {
      // Highlight active menu item
      menu.querySelectorAll("a").forEach(a =>
        a.classList.toggle("active", a.getAttribute("href") === "#" + file));
      sidebar.classList.remove("open");

      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const md = await res.text();
        content.innerHTML = DOMPurify.sanitize(marked.parse(md));

        const base = dirOf(file);
        // Make links to other .md files open inside the page
        content.querySelectorAll("a[href]").forEach(a => {
          const href = a.getAttribute("href");
          if (/^[a-z]+:|^\/\/|^#/i.test(href)) {
            if (/^https?:/i.test(href)) a.target = "_blank";
            return;
          }
          if (/\.md(#.*)?$/i.test(href)) a.setAttribute("href", "#" + resolvePath(base, href));
          else a.setAttribute("href", resolvePath(base, href));
        });
        // Fix relative image paths
        content.querySelectorAll("img[src]").forEach(img => {
          const src = img.getAttribute("src");
          if (!/^[a-z]+:|^\/\//i.test(src)) img.setAttribute("src", resolvePath(base, src));
        });
        // Syntax highlighting
        content.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));

        const page = PAGES.find(p => p.file === file);
        document.title = (page ? page.title + " – " : "") + "MD View";
        window.scrollTo(0, 0);
      } catch (err) {
        content.innerHTML = `<h2 class="error">Could not load ${file}</h2>
          <p>${err.message}</p>
          <p>If you opened this page directly from disk (file://), browsers block loading files.
          Serve the folder instead, e.g. <code>python3 -m http.server</code>, then open
          <code>http://localhost:8000</code>.</p>`;
      }
    }

    function route() {
      const file = decodeURIComponent(location.hash.slice(1)).split("#")[0] || PAGES[0].file;
      loadPage(file);
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
