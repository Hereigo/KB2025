<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6d4aff">
    <title>PWA Demo</title>
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .app-container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 12px;
            margin: 1rem 0;
        }
        
        .btn {
            background: white;
            color: #6d4aff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            color: #333;
            padding: 1rem;
            display: none;
            justify-content: space-between;
            align-items: center;
        }
        
        .install-banner.show {
            display: flex;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>🚀 PWA Ready</h1>
        <p>Your minimal, fully-featured progressive web app</p>
        
        <div class="status-card">
            <strong>Status:</strong> <span id="connection-status">Checking...</span>
        </div>
        
        <button class="btn" id="test-btn">Test Offline Mode</button>
        
        <div class="status-card hidden" id="notification-card">
            <strong>Push Notifications:</strong> <span id="notification-status">Not enabled</span>
        </div>
    </div>
    
    <!-- Install Banner -->
    <div class="install-banner" id="install-banner">
        <span>Add to Home Screen</span>
        <button class="btn" id="install-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Install</button>
    </div>
    
    <!-- Main Script -->
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('SW registration failed:', error);
                    });
            });
        }
        
        // Connection Status
        const connectionStatus = document.getElementById('connection-status');
        function updateConnectionStatus() {
            connectionStatus.textContent = navigator.onLine ? 'Online ✅' : 'Offline 🔴';
        }
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus();
        
        // Install Prompt
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });
        
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                await deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('Install prompt outcome:', outcome);
                deferredPrompt = null;
                installBanner.classList.remove('show');
            }
        });
        
        // Test Button (shows PWA is working)
        document.getElementById('test-btn').addEventListener('click', () => {
            alert('App is working! Try going offline in browser dev tools.');
        });
        
        // Notification Support
        if ('Notification' in window && 'PushManager' in window) {
            document.getElementById('notification-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
